services:
  - type: web
    name: celestial-capture-web
    env: node
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run db:push
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: celestial-capture-db
          property: connectionString
      - key: PORT
        value: "3000"
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: celestial-capture-db
    databaseName: celestial
    user: celestial_user
